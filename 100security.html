<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário para Google Sheets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Formulário de Contato</h1>
        <form id="meuFormulario" class="mx-auto" style="max-width: 500px;">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
        <div id="mensagem" class="mt-3 text-center"></div>
    </div>

    <script>
        const formulario = document.getElementById("meuFormulario");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const dados = {
                nome: formulario.nome.value,
                email: formulario.email.value
            };

            try {			
				const resposta = await fetch(
                    "https://script.google.com/macros/s/AKfycbzC-KPSDBgI9YTLkoIWW06spm77wIZg5sDC4i1TsPC4xFPfG3omOScPhIUkvudxsG0PsA/exec",
				  {
					method: "POST",
					headers: {
					  "Content-Type": "application/json",
					},
					body: JSON.stringify(dados),
					mode: "no-cors" // ⚠️ Só use isso se o CORS persistir (não ideal)
				  }
				);
                
                const resultado = await resposta.text();
                mensagem.innerHTML = `<div class="alert alert-success">${resultado}</div>`;
                formulario.reset();
            } catch (erro) {
                mensagem.innerHTML = `<div class="alert alert-danger">Erro ao enviar: ${erro.message}</div>`;
            }
        });
    </script>
</body>
</html>
